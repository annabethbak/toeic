<style>
/* Layout: OMR answer-sheet motif. Sticky tab bar, one column of "sheets"; bubbles for answers, 10-dot repetition track per word. */
:root{

  --omr:#d6336c; --omr-soft:#fbe4ec; --know:#1f9d6b; --know-soft:#dcf3ea; --dunno:#e0533d; --dunno-soft:#fde5e0;

}

:root[data-theme="dark"]{

  --warn:#e9b04f; --chip:#232a48; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:auto}

main{padding-block:20px 60px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.25}
h2{font-size:19px}
h3{font-size:16px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--omr);font-weight:600}

.grid{display:grid;gap:12px}

.kpi{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}

.tasks{display:grid;gap:10px}
.task{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px}
.task .num{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--omr);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;color:var(--omr)}
.task.done .num{background:var(--omr);color:var(--sheet)}
.task .body{flex:1;min-width:0}
.task .body b{display:block}
.bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}

.btn{border:1px solid var(--line);background:var(--sheet);padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px}

.btn.ghost{background:transparent}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* swipe deck */
.deck-area{display:grid;justify-items:center;gap:16px;padding-block:8px}
.deck{position:relative;touch-action:none;overscroll-behavior:contain;width:min(100%,380px);aspect-ratio:3/4;max-height:460px}
.card{position:absolute;inset:0;background:var(--sheet);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px -12px rgba(20,25,60,.25);display:flex;flex-direction:column;padding:22px;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .3s ease,opacity .3s ease}
.card.under{transform:scale(.95) translateY(12px);opacity:.6;pointer-events:none}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.card .word{font-family:var(--f-disp);font-size:clamp(30px,8vw,40px);font-weight:700;letter-spacing:-.02em;word-break:break-word}
.card .pos{font-family:var(--f-mono);font-size:12px;color:var(--omr)}
.card .mean{font-size:20px;font-weight:600}
.card .ex{font-size:14px;color:var(--muted);font-style:italic;max-width:30ch;margin:0 auto}
.card .hint{font-size:12px;color:var(--muted);text-align:center}
.stamp{position:absolute;top:26px;padding:4px 12px;border:3px solid;border-radius:8px;font-family:var(--f-disp);font-weight:700;font-size:22px;opacity:0;pointer-events:none}
.stamp.k{left:22px;color:var(--know);transform:rotate(-12deg)}
.stamp.d{right:22px;color:var(--dunno);transform:rotate(12deg)}
.say{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:3px 10px;font-size:12px}
.reps{display:flex;gap:4px;justify-content:center;align-items:center}
.reps i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent}
.reps i.k{background:var(--know);border-color:var(--know)}
.reps i.d{background:var(--dunno);border-color:var(--dunno)}
.reps .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.swipe-btns{display:flex;gap:14px;width:min(100%,380px)}
.swipe-btns button{flex:1;padding:12px;border-radius:14px;font-weight:700;border:2px solid}
.swipe-btns .k{border-color:var(--know);color:var(--know);background:var(--know-soft)}
.swipe-btns .d{border-color:var(--dunno);color:var(--dunno);background:var(--dunno-soft)}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* LC */
.part-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.q{border-top:1px dashed var(--line);padding-top:16px;margin-top:16px;display:grid;gap:10px}
.q:first-of-type{border-top:0;margin-top:0;padding-top:0}
.qtitle{display:flex;gap:10px;align-items:flex-start}

.play{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--omr);color:var(--omr);background:var(--omr-soft);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px}
.play.on{background:var(--omr);color:#fff}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:10px;width:100%}
.opt:hover:not(:disabled){background:var(--chip)}
.opt:disabled{cursor:default}
.bub{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.opt.pick .bub{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.opt.right{background:var(--know-soft);border-color:var(--know)}

.opt.wrong{background:var(--dunno-soft);border-color:var(--dunno)}
.opt.wrong .bub{background:var(--dunno);border-color:var(--dunno);color:#fff}
.opt .t{min-width:0}
.opt .t.blur{filter:blur(5px);opacity:.6}
.expl{font-size:13.5px;background:var(--chip);border-radius:10px;padding:10px 12px}
details.script{font-size:13.5px}
details.script summary{cursor:pointer;color:var(--muted);font-weight:600}
.script p{margin:6px 0}
.script .sp{font-family:var(--f-mono);font-size:11px;color:var(--omr);font-weight:600;margin-right:6px}
.omr-sheet{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-mono);font-size:12px}
.omr-sheet span{display:inline-flex;gap:4px;align-items:center}
.omr-sheet i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--omr);display:inline-block}
.omr-sheet i.k{background:var(--know);border-color:var(--know)}
.omr-sheet i.d{background:var(--dunno);border-color:var(--dunno)}
.omr2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;font-family:var(--f-mono);font-size:12px}
.omr-row{display:flex;align-items:center;gap:4px}
.omr-row .no{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;width:28px;text-align:left;padding:4px 0;text-decoration:underline dotted;text-underline-offset:3px}
.omr-row .b{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--omr);background:transparent;color:var(--omr);font:inherit;font-size:11px;font-weight:600;padding:0;display:grid;place-items:center}
.omr-row .b:hover:not(:disabled){background:var(--omr-soft)}

.omr-row .b.k{background:var(--know);border-color:var(--know);color:#fff;opacity:1}
.omr-row .b.d{background:var(--dunno);border-color:var(--dunno);color:#fff;opacity:1}
.q.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--omr-soft)}100%{background:transparent}}
.graphic{display:grid;gap:2px;border:1.5px solid var(--ink);border-radius:8px;padding:10px 14px;font-family:var(--f-mono);font-size:13px;max-width:420px;background:var(--paper)}
.graphic b{font-family:var(--f-body);font-size:13.5px;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px}

.lock{display:grid;gap:12px;justify-items:start}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* word list */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted)}

main.wide{max-width:1180px}

<script>
/* ================= DATA ================= */
// RC 필수 어휘(800점 목표)는 data-words.js의 WORD_DATA에서 읽는다. word|품사|뜻|예문
const RAW_WORDS = WORD_DATA.trim().split('\n').map((l,i)=>{const [w,p,m,e]=l.split('|');return {id:i,w,p,m,e};});

// RC 문항(25일 × 20문항)은 rc.json에서 불러온다.
let RC=null;
fetch('rc.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{ RC=d; render(); }).catch(()=>{ RC=false; render(); });

// LC 문항(Part 2 150 · Part 3 50세트 · Part 4 25세트)은 data-lc.js의 P2·P3·P4. 정답은 항상 원문 0번이며 화면에서는 섞어 보여준다.

const TIPS = {
 p2:"<b>Part 2</b> 첫 단어(의문사)만은 반드시 잡으세요. 800점대는 '확인해 볼게요 / 아직 몰라요 / 이미 했어요' 같은 우회 응답과, 질문 단어를 그대로 반복하거나 발음이 비슷한 보기를 걸러내는 게 관건입니다.",
 p3:"<b>Part 3</b> 대화가 나오기 전에 문제 3개를 먼저 읽어 두세요. 정답은 대개 대화 순서대로 나오고, 본문 표현이 바뀌어 나옵니다(cracked → damaged).",
 p4:"<b>Part 4</b> 첫 문장에서 담화 종류(공지·전화 메시지·뉴스·투어)를 정하세요. 숫자와 'but' 뒤 정보는 함정으로 자주 나옵니다."
};

/* ================= UTIL ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dkey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => dkey(new Date());
const addDays = (k,n) => { const [y,m,d]=k.split('-').map(Number); const t=new Date(y,m-1,d+n); return dkey(t); };
function seeded(seed){ let s = (seed*2654435761)>>>0 || 1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function perm(n, seed){ const r=seeded(seed+7), a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const L = i => 'ABCD'[i];
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* ================= STATE / STORAGE ================= */
// claude.ai 안에서 열릴 때(iframe)만 계정 저장·음성 기능을 최대 5초 기다린다. 일반 웹사이트에서는 기다리지 않고 바로 연다.
const CLAUDE_WAIT = (()=>{ try{ return window.self!==window.top ? 20 : 0; }catch(e){ return 20; } })();
const LS_KEY='toeic800-state-v1';
function blank(){ return {v:1,u:0,next:0,words:{},days:{},wrong:{},rc:{},set:{newPerDay:15,rate:1,showP2:false}}; }
let S = blank();
try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const o=JSON.parse(raw); if(o&&o.v===1) S=Object.assign(blank(),o); } }catch(e){}
let store = {kind:'local', ref:null}, ready=false;
// 로그인 계정이 확인되면 계정별 키(toeic800-state-v1:<uid>)를 쓴다. 비로그인은 기존 키 그대로.
let lsKey = LS_KEY;
function loadLocal(key){ try{ const raw=localStorage.getItem(key); if(raw){ const o=JSON.parse(raw); if(o&&o.v===1) return Object.assign(blank(),o); } }catch(e){} return blank(); }
let saveTimer=null, writing=Promise.resolve();
// u는 사용자가 직접 한 동작에서만 올린다. 오늘 덱 자동 생성 같은 저장(auto)은 올리지 않는다.
function save(auto){
  if(!auto) S.u = Date.now();
  try{ localStorage.setItem(lsKey, JSON.stringify(S)); }catch(e){}
  if(store.kind!=='db') return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ writing = writing.then(syncWrite).catch(()=>setSync('저장 실패 · 이 브라우저에만 보관')); },700);
}
// 쓰기 직전에 계정 기록을 다시 읽어 합친 뒤 쓴다(다른 기기에서 한 학습을 덮어쓰지 않도록).
async function syncWrite(){
  const before=JSON.stringify(S);
  try{ const snap=await store.ref.get(); if(snap.exists){ const r=snap.data(); if(r&&r.v===1) S=mergeState(S,r); } }catch(e){}
  const changed=JSON.stringify(S)!==before;
  try{ localStorage.setItem(lsKey, JSON.stringify(S)); }catch(e){}
  await store.ref.set(JSON.parse(JSON.stringify(S)));
  setSync('계정에 저장됨');
  if(changed && !dragging) keepScroll(render);
}
function setSync(t){ $('#sync').textContent=t; }

/* 두 기록(a: 이 기기, b: 계정)을 항목별로 합친다. 어느 쪽의 학습도 잃지 않는 것이 원칙. */
const wDate=v=>String(v||'').replace(/^x/,'');
const activity=d=>d?(d.pos||0)+Object.keys(d.lc||{}).length+(d.rcn||0):0;
function mergeState(a,b,initial){
  a=Object.assign(blank(),a); b=Object.assign(blank(),b);
  // 초기화는 '세대(r0)'로 구분: 더 최근에 초기화된 쪽만 남긴다.
  if((a.r0||0)!==(b.r0||0)) return JSON.parse(JSON.stringify((a.r0||0)>(b.r0||0)?a:b));
  const m=blank(); m.r0=a.r0||0;
  m.u=Math.max(a.u||0,b.u||0);
  if(a.bk||b.bk) m.bk=Math.max(a.bk||0,b.bk||0);
  m.next=Math.max(a.next||0,b.next||0);
  m.set=Object.assign({}, ((a.u||0)>(b.u||0)?a:b).set);
  // 단어: 마지막으로 건드린 쪽(t), 같으면 반복 횟수가 많은 쪽, 그래도 같으면 계정 쪽
  for(const id of new Set([...Object.keys(a.words),...Object.keys(b.words)])){
    const x=a.words[id], y=b.words[id];
    m.words[id]=JSON.parse(JSON.stringify(!x?y:!y?x:((x.t||0)!==(y.t||0)?((x.t||0)>(y.t||0)?x:y):((x.r||0)>(y.r||0)?x:y))));
  }
  // 날짜별 기록: 활동이 많은 쪽을 기준으로, LC 답은 합친다. 아무것도 안 한 날은 버리고 새로 만든다.
  for(const k of new Set([...Object.keys(a.days),...Object.keys(b.days)])){
    const x=a.days[k], y=b.days[k];
    // 처음 불러올 때, 이 기기에만 있고 아무것도 안 한 날(예전 기록으로 자동 생성된 덱)은 버리고 새로 만든다
    if(initial && !y && activity(x)===0) continue;
    const base=!y?x:!x?y:(activity(x)>activity(y)?x:y), other=base===x?y:x;
    const d=JSON.parse(JSON.stringify(base));
    d.lc=Object.assign({}, other&&other.lc, base.lc);
    d.rcn=Math.max(x&&x.rcn||0, y&&y.rcn||0);
    m.days[k]=d;
  }
  // RC: 답은 합치고(한 번 고른 답은 바뀌지 않음), 시작·완료 시각은 이른 쪽
  for(const k of new Set([...Object.keys(a.rc||{}),...Object.keys(b.rc||{})])){
    const x=(a.rc||{})[k]||{a:{}}, y=(b.rc||{})[k]||{a:{}};
    const r={a:Object.assign({}, y.a, x.a)};
    const t0=[x.t0,y.t0].filter(Boolean), t1=[x.t1,y.t1].filter(Boolean);
    if(t0.length) r.t0=Math.min(...t0); if(t1.length) r.t1=Math.min(...t1);
    m.rc[k]=r;
  }
  // 오답: 날짜가 늦은 쪽, 같은 날이면 '복습 완료(x)'가 이긴다
  for(const q of new Set([...Object.keys(a.wrong),...Object.keys(b.wrong)])){
    const x=a.wrong[q], y=b.wrong[q];
    if(!x||!y){ m.wrong[q]=x||y; continue; }
    const dx=wDate(x), dy=wDate(y);
    m.wrong[q]= dx!==dy ? (dx>dy?x:y) : (String(x)[0]==='x'?x:y);
  }
  return m;
}
async function initStore(){
  try{
    for(let i=0;i<CLAUDE_WAIT && !(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,250));
    if(!(window.claude&&window.claude.use)) return;
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db||!user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc('data/users/'+uid+'/state');
    // 다른 계정이나 비로그인 상태에서 이 브라우저에 남은 기록은 섞지 않는다
    lsKey = LS_KEY+':'+uid; S = loadLocal(lsKey);
    const snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
    store = {kind:'db', ref};
    if(snap.exists){ const remote=snap.data(); if(remote && remote.v===1) S=mergeState(S,remote,true); }
    try{ localStorage.setItem(lsKey,JSON.stringify(S)); }catch(e){}
    setSync('계정에 저장됨');
  }catch(e){ setSync('이 브라우저에 저장 중'); }
  finally{
    // 계정 기록을 확인한 뒤에야 오늘 덱을 만들고 화면을 연다(예전 기록으로 학습이 시작되지 않도록)
    ready=true; ensureToday(); keepScroll(render);
    if(store.kind==='db') save(true);
  }
}

/* ================= DAY SETUP ================= */
function studyIndex(k){ return Object.keys(S.days).sort().indexOf(k); }
function ensureToday(){
  const t=today();
  if(S.days[t]) return S.days[t];
  // drop finished decks from older days to keep the record small
  for(const k in S.days){ if(S.days[k].pos>=S.days[k].deck.length) S.days[k].deck=[]; }
  const due = Object.entries(S.words).filter(([,w])=>!w.m && w.d<=t).map(([id])=>+id);
  const fresh=[];
  while(fresh.length<S.set.newPerDay && S.next<WORDS().length){ if(!S.words[S.next]) fresh.push(S.next); S.next++; }
  fresh.forEach(id=>{ S.words[id]={r:0,h:'',d:t,m:false,f:t}; });
  S.days[t]={deck:shuffle([...due,...fresh]), pos:0, k:0, x:0, nw:fresh.length, rv:due.length, lc:{}};
  save(true);
  return S.days[t];
}
function WORDS(){ return RAW_WORDS; }

/* ================= TTS ================= */
let tts=null, playingId=null;
(async()=>{ for(let i=0;i<CLAUDE_WAIT && !(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,250)); try{ if(window.claude&&claude.use){ tts=await claude.use('tts'); if(tts) tts.onState(({state})=>{ if(state==='idle'){ playingId=null; paintPlay(); } }); } }catch(e){} })();
const VOICE={W:'airy',M:'rounded',M2:'buttery',N:'glassy'};
function stopAudio(){ try{ tts&&tts.stop(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} playingId=null; paintPlay(); }
async function speak(lines, id){
  if(playingId===id){ stopAudio(); return; }
  stopAudio(); playingId=id; paintPlay();
  const rate=S.set.rate;
  if(tts){
    try{ await tts.speak(lines.map(([s,t])=>({text:t, voice:VOICE[s]||'glassy', language:'en-US', rate}))); }
    catch(e){ if(e && (e.code==='not_granted'||e.code==='unavailable')){ tts=null; return speak(lines,id); } }
    if(playingId===id){ playingId=null; paintPlay(); }
    return;
  }
  if(!('speechSynthesis' in window)){ toast('이 브라우저에서는 음성을 재생할 수 없어요. 스크립트를 보며 연습하세요.'); playingId=null; paintPlay(); return; }
  const vs=speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));
  const pick=s=>{ if(!vs.length) return null; const idx={W:0,M:1,M2:2,N:3}[s]||0; return vs[idx%vs.length]; };
  lines.forEach(([s,t],i)=>{ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=rate*0.95; const v=pick(s); if(v) u.voice=v; u.pitch = s==='M'||s==='M2'?0.85:1.1;
    if(i===lines.length-1) u.onend=()=>{ if(playingId===id){playingId=null;paintPlay();} }; speechSynthesis.speak(u); });
}
function paintPlay(){ document.querySelectorAll('[data-play]').forEach(b=>{ const on=b.dataset.play===playingId; b.classList.toggle('on',on); b.querySelector('span').textContent= on?'정지':(b.dataset.label||'듣기'); }); }

/* ================= LC SET ================= */
const LC_DAYS=25;
function lcSet(dayKey){
  // Day 1~25: 하루 Part 2 6문항·Part 3 2세트·Part 4 1세트, 25일 동안 겹치지 않음(26일째부터 Day 1로 다시 시작)
  const i=Math.max(0,studyIndex(dayKey))%LC_DAYS;
  const items=[];
  for(let k=0;k<6;k++){ const n=i*6+k; items.push({part:2,id:'p2-'+n,n}); }
  for(let k=0;k<2;k++){ const n=i*2+k; items.push({part:3,id:'p3-'+n,n}); }
  items.push({part:4,id:'p4-'+i,n:i});
  return items;
}
function qList(items){ const out=[]; items.forEach(it=>{ if(it.part===2) out.push(it.id); else (it.part===3?P3:P4)[it.n].qs.forEach((_,j)=>out.push(it.id+'-'+j)); }); return out; }
function qInfo(qid){
  const [p,n,j]=qid.split('-'); const part=+p.slice(1), ni=+n;
  if(part===2){ const [q,ch,ex]=P2[ni]; return {part,q,ch,ex,order:perm(3,ni*31+2),lines:[[ni%2?'W':'M',q]],qtext:null}; }
  const set=(part===3?P3:P4)[ni], [q,ch,ex]=set.qs[+j];
  return {part,q,ch,ex,order:perm(4,ni*97+(+j)*13+part),lines:set.lines,set};
}
function dayStats(day){ const a=day.lc||{}; const ks=Object.keys(a); return {n:ks.length, c:ks.filter(k=>a[k]===0).length}; }

/* ================= VIEWS ================= */
let view='home', wordFilter='learning', wordQuery='', lcOverride=false, flipped=false;
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button[data-v]'); if(b) go(b.dataset.v); });
function go(v){ view=v; stopAudio(); flipped=false; document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.v===v)); render(); window.scrollTo({top:0}); }

function render(){
  if(!ready){ $('#app').classList.remove('wide'); $('#app').innerHTML='<section class="sheet empty" role="status"><b>계정 학습 기록을 불러오는 중…</b><span class="muted" style="font-size:13px">다른 기기에서 공부한 내용까지 합친 뒤 열려요. 몇 초면 끝나요.</span></section>'; return; }
  const day=ensureToday();
  const el=$('#app');
  el.classList.toggle('wide', view==='rc');
  el.innerHTML = ({home:vHome,vocab:vVocab,lc:vLC,rc:vRC,words:vWords,notes:vNotes,set:vSet})[view](day);
  if(view==='vocab') bindDeck();
  paintPlay();
}

function counts(){
  let m=0,l=0; for(const id in S.words){ S.words[id].m?m++:l++; }
  return {m,l,u:WORDS().length-m-l};
}
function repDots(w){
  const h=(w&&w.h)||''; let s='';
  for(let i=0;i<10;i++){ const c=h[i]; s+=`<i class="${c==='1'?'k':c==='0'?'d':''}"></i>`; }
  const r=w?w.r:0;
  return `<span class="reps" title="10회 반복 기록">${s}<span class="n">${Math.min(r,99)}/10</span></span>`;
}

function vHome(day){
  const t=today(), deckLeft=day.deck.length-day.pos, vDone=deckLeft<=0;
  const items=lcSet(t), qs=qList(items), st=dayStats(day), lDone=st.n>=qs.length;
  const c=counts();
  const keys=Object.keys(S.days).sort();
  const active=d=>d&&(d.pos>0||dayStats(d).n>0||d.rcn>0);
  let streak=0; { let k=active(S.days[t])?t:addDays(t,-1); while(active(S.days[k])){ streak++; k=addDays(k,-1); } }
  let tn=0,tc=0; const byPart={2:[0,0],3:[0,0],4:[0,0]};
  keys.forEach(k=>{ const a=S.days[k].lc||{}; for(const q in a){ tn++; if(a[q]===0) tc++; const p=+q[1]; byPart[p][0]++; if(a[q]===0) byPart[p][1]++; } });
  const acc = tn? Math.round(tc/tn*100) : null;
  const dIdx=studyIndex(t)+1;
  const rcAll=rcTotals(); const rd=rcToday(), rst=rcStats(rd), rDone=rst.n>=20;
  return `
  <section class="grid" style="gap:6px">
    <div class="eyebrow">Day ${dIdx} · ${t.replace(/-/g,'.')}</div>
    <h1>${vDone&&lDone&&rDone?'오늘 루틴 완료! 내일 또 만나요.':vDone&&lDone?'LC 끝. 마지막으로 RC 20문항!':vDone?'단어 끝. 이제 LC 15문항으로 귀를 깨워요.':'오늘은 단어 카드부터 시작해요.'}</h1>
  </section>
  ${backupReminder()}
  <section class="grid kpis">
    <div class="kpi"><div class="v">${streak}<small>일</small></div><div class="l">연속 학습</div></div>
    <div class="kpi"><div class="v">${c.m}<small>/${WORDS().length}</small></div><div class="l">외운 단어 (10회 반복 ✓)</div></div>
    <div class="kpi"><div class="v">${acc===null?'–':acc+'<small>%</small>'}</div><div class="l">LC 누적 정답률 (${tn}문항)</div></div>
    <div class="kpi"><div class="v">${rcAll.n?Math.round(rcAll.c/rcAll.n*100)+'<small>%</small>':'–'}</div><div class="l">RC 누적 정답률 (${rcAll.n}문항)</div></div>
  </section>
  <section class="sheet grid" style="gap:14px">
    <div class="row" style="justify-content:space-between"><h2>오늘의 루틴</h2><span class="chip pink">목표 LC 400+ / 총점 800</span></div>
    <div class="tasks">
      <div class="task ${vDone?'done':''}">
        <div class="num">1</div>
        <div class="body"><b>RC 단어 카드 ${day.deck.length}장</b>
          <span class="muted" style="font-size:13px">새 단어 ${day.nw} · 복습 ${day.rv} · ← 알아요 ${day.k} · 몰라요 → ${day.x}</span>
          <div class="bar"><i style="width:${day.deck.length?Math.round(day.pos/day.deck.length*100):100}%"></i></div></div>
        <button class="btn ${vDone?'ghost':'pri'}" data-a="go" data-v="vocab">${vDone?'다시 보기':'시작'}</button>
      </div>
      <div class="task ${lDone?'done':''}">
        <div class="num">2</div>
        <div class="body"><b>LC 실전 ${qs.length}문항 · Day ${studyIndex(t)%LC_DAYS+1}/${LC_DAYS}</b>

function accChart(keys){
  const W=320,H=150,P=24, n=Math.max(keys.length,1), bw=(W-P-8)/Math.max(n,7);
  const y=v=>H-18-(v/100)*(H-36);
  let bars='';
  keys.forEach((k,i)=>{ const s=dayStats(S.days[k]); if(!s.n) { bars+=`<text x="${P+i*bw+bw/2}" y="${H-22}" text-anchor="middle">·</text>`; } else { const v=s.c/s.n*100; bars+=`<rect x="${P+i*bw+bw*0.18}" y="${y(v)}" width="${bw*0.64}" height="${H-18-y(v)}" rx="3" fill="var(--omr)"><title>${k}: ${Math.round(v)}%</title></rect>`; }
    if(i===0||i===keys.length-1) bars+=`<text x="${P+i*bw+bw/2}" y="${H-4}" text-anchor="middle">${k.slice(5).replace('-','/')}</text>`; });
  const grid=[0,50,100].map(v=>`<line x1="${P}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join('');
  const goal=`<line x1="${P}" x2="${W-4}" y1="${y(80)}" y2="${y(80)}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="LC 정답률 막대그래프">${grid}${goal}${bars}</svg>`;
}
function repChart(){
  const W=320,H=150,P=24, b=Array(11).fill(0), m=Array(11).fill(0);
  for(const id in S.words){ const w=S.words[id], r=Math.min(w.r,10); if(w.m) m[r]++; else b[r]++; }
  const max=Math.max(1,...b.map((v,i)=>v+m[i])), bw=(W-P-8)/11, y=v=>(v/max)*(H-36);
  let s='';
  for(let i=0;i<11;i++){ const x=P+i*bw+bw*0.15, w=bw*0.7, h1=y(b[i]), h2=y(m[i]);
    if(b[i]) s+=`<rect x="${x}" y="${H-18-h1}" width="${w}" height="${h1}" rx="2" fill="var(--omr)"><title>${i}회: 반복 중 ${b[i]}개</title></rect>`;
    if(m[i]) s+=`<rect x="${x}" y="${H-18-h1-h2}" width="${w}" height="${h2}" rx="2" fill="var(--know)"><title>${i}회: 외움 ${m[i]}개</title></rect>`;
    s+=`<text x="${x+w/2}" y="${H-4}" text-anchor="middle">${i}</text>`; }
  s+=`<text x="${P-4}" y="${H-18-y(max)+3}" text-anchor="end">${max}</text><line x1="${P}" x2="${W-4}" y1="${H-18}" y2="${H-18}" stroke="var(--line)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="반복 횟수별 단어 수">${s}</svg>`;
}

function cardHTML(id,under){

    </div>
    ${repDots(st)}
    <div class="stamp k">알아요</div><div class="stamp d">몰라요</div>

function bindDeck(){
  const card=$('#card'); if(!card) return;
  $('#bK').onclick=()=>decide(true); $('#bD').onclick=()=>decide(false);
  const say=card.querySelector('[data-say]');
  say.addEventListener('pointerdown',e=>e.stopPropagation());
  say.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
  say.onclick=e=>{ e.stopPropagation(); speak([['N',e.currentTarget.dataset.say]],'w'+card.dataset.id); };
  const sk=card.querySelector('.stamp.k'), sd=card.querySelector('.stamp.d');
  let x0=null,y0=0,dx=0,dy=0,t0=0;
  const start=(x,y)=>{ dragging=true; x0=x; y0=y; dx=0; dy=0; t0=performance.now(); card.style.transition='none'; };
  const move=(x,y)=>{ if(x0===null) return; dx=x-x0; dy=y-y0;
    card.style.transform=`translate(${dx}px,${dy*0.2}px) rotate(${dx/16}deg)`;
    sk.style.opacity=Math.max(0,Math.min(1,-dx/80)); sd.style.opacity=Math.max(0,Math.min(1,dx/80)); };
  // 앱이 제스처를 가로채 '취소'가 와도, 이미 충분히 밀었거나 빠르게 튕겼으면 넘긴다.
  const finish=()=>{ if(x0===null) return; dragging=false; const dt=Math.max(1,performance.now()-t0); x0=null; card.style.transition='';
    const th=Math.min(100,card.offsetWidth*0.22), fast=Math.abs(dx)>40 && Math.abs(dx)/dt>0.3;
    if(Math.abs(dx)>th || fast){ decide(dx<0); return; }
    card.style.transform=''; sk.style.opacity=0; sd.style.opacity=0;
    if(Math.abs(dx)<6 && Math.abs(dy)<6){ flipped=!flipped; render(); } };
  // 터치: 전용 이벤트로 받고 카드 위의 기본 제스처(스크롤·앱 뒤로가기 스와이프)를 막는다.
  card.addEventListener('touchstart',e=>{ lastTouch=Date.now(); if(e.touches.length!==1) return; e.preventDefault(); const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:false});
  card.addEventListener('touchmove',e=>{ lastTouch=Date.now(); if(x0===null) return; e.preventDefault(); const t=e.touches[0]; move(t.clientX,t.clientY); },{passive:false});
  card.addEventListener('touchend',e=>{ lastTouch=Date.now(); if(x0===null) return; e.preventDefault(); finish(); },{passive:false});
  card.addEventListener('touchcancel',()=>{ lastTouch=Date.now(); finish(); });
  // 마우스·펜 (터치 직후 브라우저가 흉내 내는 마우스 이벤트는 무시)
  const notMouse=e=>e.pointerType==='touch'||Date.now()-lastTouch<800;
  card.addEventListener('pointerdown',e=>{ if(notMouse(e)) return; start(e.clientX,e.clientY); try{ card.setPointerCapture(e.pointerId); }catch(_){} });
  card.addEventListener('pointermove',e=>{ if(notMouse(e)) return; move(e.clientX,e.clientY); });
  card.addEventListener('pointerup',e=>{ if(notMouse(e)) return; finish(); });
  card.addEventListener('pointercancel',e=>{ if(notMouse(e)) return; finish(); });
}
let deciding=false, lastTouch=0, dragging=false;
function decide(known){
  const day=S.days[today()]; const card=$('#card'); if(!card||deciding) return;
  deciding=true;
  const id=+card.dataset.id, t=today();
  const w=S.words[id]||(S.words[id]={r:0,h:'',d:t,m:false,f:t});
  w.r++; w.t=Date.now(); w.h=(w.h+(known?'1':'0')).slice(-10);
  w.d=addDays(t, known?2:1);
  if(known&&w.r>=10){ w.m=true; w.md=t; }
  known?day.k++:day.x++;
  day.pos++; flipped=false; save();
  card.querySelector(known?'.stamp.k':'.stamp.d').style.opacity=1;
  card.style.transform=`translate(${known?-600:600}px,40px) rotate(${known?-30:30}deg)`; card.style.opacity='0';
  if(w.m && w.r>=10 && known) toast(`✓ "${WORDS()[id].w}" 10회 반복 완료! 외운 단어로 체크했어요.`);
  setTimeout(()=>{ deciding=false; render(); },260);
}
document.addEventListener('keydown',e=>{
  if(view!=='vocab'||e.target.matches('input,select,textarea')) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); decide(true); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); decide(false); }
  else if(e.key===' '){ e.preventDefault(); flipped=!flipped; render(); }
});

/* ---------- LC ---------- */
function vLC(day){
  const t=today(), deckLeft=day.deck.length-day.pos;

    <div class="omr2" aria-label="답안지">${qs.map((q,i)=>omrRow(q,i+1,qInfo(q).order,(day.lc||{})[q],'ans')).join('')}</div>
    <p class="muted" style="margin:0;font-size:12.5px">답안지 칸을 눌러 바로 마킹하거나 아래 문제의 보기를 눌러도 돼요. 번호를 누르면 그 문제로 이동해요.</p>
    <label class="toggle"><input type="checkbox" id="p2text" ${S.set.showP2?'checked':''}> Part 2 보기 문장을 미리 보기 (실전에서는 보기가 인쇄되지 않아요)</label>
  </section>`;
  const p2=`<section class="sheet"><div class="part-head"><h2>Part 2</h2><span class="muted">질의 응답 · 질문과 보기 (A)(B)(C)가 음성으로만 나옵니다</span></div><div class="tip" style="margin:10px 0 16px">${TIPS.p2}</div>
    ${parts[2].map(it=>qBlock(it.id, ++no, day)).join('')}</section>`;
  const setBlock=(it,label)=>{ const set=(it.part===3?P3:P4)[it.n]; const sid=it.id;

    const nums=set.qs.map(()=>++no);
    return `<div class="q" style="gap:12px"><div class="row"><button class="play" data-play="${sid}" data-label="대화 듣기" data-a="playset" data-id="${sid}">▶ <span>듣기</span></button><span class="muted" style="font-size:13px">Questions ${nums[0]}–${nums[2]}. ${esc(set.intro.replace('Questions refer to the following ',''))}</span></div>
      ${set.graphic?`<div class="graphic" role="table" aria-label="시각 자료"><b>${esc(set.graphic[0])}</b>${set.graphic.slice(1).map(g=>`<span>${esc(g)}</span>`).join('')}</div>`:''}
      ${set.qs.map((_,j)=>qBlock(sid+'-'+j, nums[j], day, true)).join('')}

  const p3=`<section class="sheet"><div class="part-head"><h2>Part 3</h2><span class="muted">짧은 대화</span></div><div class="tip" style="margin:10px 0 6px">${TIPS.p3}</div>${parts[3].map(it=>setBlock(it)).join('')}</section>`;
  const p4=`<section class="sheet"><div class="part-head"><h2>Part 4</h2><span class="muted">짧은 담화</span></div><div class="tip" style="margin:10px 0 6px">${TIPS.p4}</div>${parts[4].map(it=>setBlock(it)).join('')}</section>`;
  const done = st.n>=qs.length ? `<section class="sheet grid" style="gap:8px"><h2>채점 결과 ${st.c}/${qs.length} (${Math.round(st.c/qs.length*100)}%)</h2><p class="muted" style="margin:0">${st.c/qs.length>=0.8?'800점 페이스예요. 틀린 문제는 스크립트를 보며 쉐도잉해 보세요.':'틀린 문제는 오답노트에 모였어요. 스크립트를 보며 다시 들어 보세요.'}</p><div class="row"><button class="btn" data-a="go" data-v="notes">오답노트</button><button class="btn ghost" data-a="go" data-v="home">대시보드</button></div></section>`:'';
  return head+p2+p3+p4+done;
}
function qBlock(qid,no,day,inSet){
  const info=qInfo(qid), a=(day.lc||{})[qid], answered=a!==undefined;
  const n=info.ch.length;
  const showText = info.part!==2 || answered || S.set.showP2;
  const opts=info.order.map((orig,pos)=>{
    let cls=''; if(answered){ if(orig===0) cls='right'; else if(orig===a) cls='wrong'; }
    return `<button class="opt ${cls}" ${answered?'disabled':''} data-a="ans" data-q="${qid}" data-o="${orig}"><span class="bub">${L(pos)}</span><span class="t ${showText?'':'blur'}">${showText?esc(info.ch[orig]):'·····'}</span></button>`; }).join('');
  const play = info.part===2 ? `<button class="play" data-play="${qid}" data-a="playp2" data-id="${qid}">▶ <span>듣기</span></button>` : '';
  const qtxt = info.part===2 ? (answered?`<span>${esc(info.q)}</span>`:`<span class="muted">Mark your answer on your answer sheet.</span>`) : `<b>${esc(info.q)}</b>`;
  const expl = answered ? `<div class="expl">${a===0?'<b style="color:var(--know)">정답</b>':'<b style="color:var(--dunno)">오답</b> · 정답 ('+L(info.order.indexOf(0))+')'} — ${esc(info.ex)}</div>`:'';
  return `<div class="q" id="q-${qid}" ${inSet?'style="border-top:0;margin-top:0;padding-top:0"':''}><div class="qtitle"><span class="qno">${pad(no)}</span><div class="grid" style="gap:8px;min-width:0">${play?'<div>'+play+'</div>':''}${qtxt}</div></div><div class="opts">${opts}</div>${expl}</div>`;
}
function playP2(qid){ const info=qInfo(qid); const ni=+qid.split('-')[1]; const other=ni%2?'M':'W';
  speak([...info.lines, ...info.order.map((o,pos)=>[other, L(pos)+'. '+info.ch[o]])], qid); }
function playSet(sid){ const [p,n]=sid.split('-'); const set=(p==='p3'?P3:P4)[+n]; speak([['N',set.intro], ...set.lines], sid); }
function answer(qid,orig){
  const day=S.days[today()]; day.lc=day.lc||{}; if(day.lc[qid]!==undefined) return;
  day.lc[qid]=orig;
  if(orig!==0) S.wrong[qid]=today(); else if(S.wrong[qid]) S.wrong[qid]='x'+today();
  save(); const y=window.scrollY; render(); window.scrollTo({top:y});
}

/* ---------- word list ---------- */

function rcQs(d){ const out=[]; let no=0; RC[d-1].forEach((it,i)=>{ if(it.t===5) out.push({qid:`r${d}-${i}-0`,no:++no}); else it.qs.forEach((q,j)=>out.push({qid:`r${d}-${i}-${j}`,no:++no})); }); return out; }
function rcQ(qid){ const [d,i,j]=qid.slice(1).split('-').map(Number); const it=RC[d-1][i]; return {d,i,j,it,q:it.t===5?it:it.qs[j],order:perm(4,d*1009+i*37+j*7)}; }
function rcStats(d){ const r=(S.rc||{})[d]; if(!r) return {n:0,c:0}; const ks=Object.keys(r.a); return {n:ks.length,c:ks.filter(k=>r.a[k]===0).length}; }
function rcTotals(){ const out={n:0,c:0,part:{}}; for(const d in (S.rc||{})){ const a=S.rc[d].a||{}; for(const q in a){ out.n++; const ok=a[q]===0; if(ok) out.c++;

function fmtLine(line,blanks){

let bkCode='', pendingImport=null, bkOverConfirm=false;
const isObj=x=>!!x && typeof x==='object' && !Array.isArray(x);
function encodeBackup(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj)); let bin='';
  for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return 'T8B1:'+btoa(bin);
}
// 백업 코드(T8B1:…) 또는 JSON 텍스트를 읽는다. 형식이 맞지 않으면 null.
function decodeBackup(text){
  try{
    let t=String(text||'').trim(), json;
    if(t.startsWith('{')) json=t;
    else{ t=t.replace(/\s+/g,'').replace(/^T8B1:/,''); if(!t) return null;
      const bin=atob(t); json=new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(bin,c=>c.charCodeAt(0))); }
    const o=JSON.parse(json);
    if(!isObj(o) || o.v!==1 || !isObj(o.words) || !isObj(o.days)) return null;
    const n=Object.assign(blank(),o);
    for(const k of ['wrong','rc','set']) if(!isObj(n[k])) n[k]=blank()[k];
    for(const d of Object.values(n.days)) if(!isObj(d)) return null;
    return n;
  }catch(e){ return null; }
}
function backupSummary(st){
  const words=Object.values(st.words).filter(w=>w&&w.m).length;
  const lc=Object.values(st.days).reduce((a,d)=>a+Object.keys(d.lc||{}).length,0);
  const rc=Object.values(st.rc||{}).reduce((a,d)=>a+Object.keys((d&&d.a)||{}).length,0);
  const last=Object.keys(st.days).filter(k=>activity(st.days[k])>0).sort().pop();
  return {words,lc,rc,last:last?last.replace(/-/g,'.'):'없음'};
}
function markBackup(){ S.bk=Date.now(); save(); }
function backupFilename(){ return 'toeic800-backup-'+today().replace(/-/g,'')+'.json'; }
async function saveBackupFile(){
  const data=JSON.stringify(S);
  let dl=null; try{ if(window.claude&&claude.use) dl=await claude.use('downloads'); }catch(e){}
  if(dl){
    try{ await dl.save({filename:backupFilename(), data}); markBackup(); bkCode=''; keepScroll(render); toast('백업 파일을 저장했어요'); return; }
    catch(e){ if(e&&e.code==='declined'){ toast('파일 저장을 취소했어요'); return; } }
  }
  // 파일 저장이 막힌 환경: 백업 코드를 대신 보여 준다

  toast('파일 저장이 안 되는 환경이라 백업 코드를 표시했어요');
}

  try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok,fail); else fail(); }catch(e){ fail(); }
}

function vBackup(){
  const age=backupAge(), sum=pendingImport?backupSummary(pendingImport):null;
  const confirm = !pendingImport ? '' : bkOverConfirm
    ? `<div class="confirm danger" role="alertdialog" aria-label="덮어쓰기 확인"><b>정말 덮어쓸까요?</b><span style="font-size:13.5px">지금 이 기기와 계정의 학습 기록이 백업 내용으로 바뀌고, 백업 이후에 한 학습은 사라져요.</span>
        <div class="row"><button class="btn" style="border-color:var(--dunno);color:var(--dunno)" data-a="bkover">네, 덮어쓰기</button><button class="btn ghost" data-a="bkcancel">취소</button></div></div>`
    : `<div class="confirm" role="alertdialog" aria-label="백업 불러오기 확인"><b>이 백업을 불러올까요?</b>
        <ul style="font-size:13.5px"><li>외운 단어 ${sum.words}개</li><li>LC 푼 문항 ${sum.lc}개</li><li>RC 푼 문항 ${sum.rc}개</li><li>마지막 학습일 ${sum.last}</li></ul>
        <span class="muted" style="font-size:13px">합치기는 지금 기록과 백업을 항목별로 합쳐 어느 쪽 진도도 잃지 않아요.</span>
        <div class="row"><button class="btn pri" data-a="bkmerge">합치기 (권장)</button><button class="btn" data-a="bkoverask">덮어쓰기</button><button class="btn ghost" data-a="bkcancel">취소</button></div></div>`;
  return `<section class="sheet grid bk" style="gap:14px" id="backup">
    <h2>학습 기록 백업</h2>
    <p class="muted" style="margin:0;font-size:13.5px">마지막 백업: ${age===null?'없음':age===0?'오늘':age+'일 전'} · 백업 파일이나 백업 코드를 보관해 두면 기기를 바꾸거나 브라우저 기록을 지워도 진도를 되살릴 수 있어요.</p>
    <div class="row"><button class="btn pri" data-a="bkfile">백업 파일 저장</button><button class="btn" data-a="bkcopy">백업 코드 복사</button></div>
    ${bkCode?`<label class="grid" style="gap:6px"><span style="font-size:13px">아래 코드를 전체 선택해 복사한 뒤 메모 앱 등에 보관하세요.</span><textarea id="bkout" readonly>${esc(bkCode)}</textarea></label>`:''}
    <h3>불러오기</h3>
    <div class="row"><label class="btn" for="bkin" tabindex="0">백업 파일 불러오기</label><input type="file" id="bkin" accept=".json,application/json" hidden></div>
    <label class="grid" style="gap:6px"><span style="font-size:13px">또는 백업 코드 붙여넣기</span><textarea id="bkpaste" placeholder="T8B1:로 시작하는 백업 코드를 붙여넣으세요"></textarea></label>
    <div class="row"><button class="btn" data-a="bkpaste">불러오기</button></div>
    ${confirm}
  </section>`;
}

function omrRow(qid,no,order,a,act){
  const answered=a!==undefined;
  return `<div class="omr-row"><button class="no" data-a="jump" data-q="${qid}" aria-label="${no}번 문제로 이동">${pad(no)}</button>${order.map((orig,pos)=>{
    const cls=answered?(orig===0?'k':orig===a?'d':''):'';
    return `<button class="b ${cls}" ${answered?'disabled':''} data-a="${act}" data-q="${qid}" data-o="${orig}" aria-label="${no}번 ${L(pos)}">${L(pos)}</button>`; }).join('')}</div>`;
}
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo({top:y}); }
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  const a=el.dataset.a, q=el.dataset.q;
  switch(a){
    case 'go': go(el.dataset.v); break;
    case 'rcgo': rcDay=+el.dataset.d||null; go('rc'); break;
    case 'rcday': rcDay=+el.dataset.d; render(); window.scrollTo({top:0}); break;
    case 'lcskip': lcOverride=true; render(); break;
    case 'ans': answer(q,+el.dataset.o); break;
    case 'ansrc': answerRC(q,+el.dataset.o); break;
    case 'jump': { const t=document.getElementById('q-'+q); if(t){ t.scrollIntoView({behavior:'smooth',block:'center'}); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); } break; }
    case 'playset': playSet(el.dataset.id); break;
    case 'playp2': playP2(el.dataset.id); break;
    case 'playnote': { const info=qInfo(q); speak(info.part===2?[...info.lines,['W',info.ch[0]]]:info.lines,'n'+q); break; }
    case 'wf': wordFilter=el.dataset.f; render(); break;
    case 'tm': keepScroll(()=>toggleM(+el.dataset.id)); break;
    case 'delw': S.wrong[q]='x'+today(); save(); keepScroll(render); break;
    case 'resetask': confirmReset=true; render(); break;
    case 'resetno': confirmReset=false; render(); break;
    case 'resetyes': S=blank(); S.r0=Date.now(); confirmReset=false; save(); go('home'); break;
    case 'bkfile': saveBackupFile(); break;
    case 'bkcopy': copyBackupCode(); break;
    case 'bkpaste': { const t=$('#bkpaste'); startImport(t?t.value:''); break; }
    case 'bkmerge': applyImport('merge'); break;
    case 'bkoverask': bkOverConfirm=true; keepScroll(render); break;
    case 'bkover': applyImport('overwrite'); break;
    case 'bkcancel': pendingImport=null; bkOverConfirm=false; keepScroll(render); break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='bkin'){ const f=t.files&&t.files[0]; t.value=''; if(f) f.text().then(startImport,()=>toast('백업 내용을 읽을 수 없어요')); return; }
  if(t.id==='p2text'){ S.set.showP2=t.checked; save(); keepScroll(render); }
  else if(t.id==='npd'){ S.set.newPerDay=+t.value; save(); toast('내일 덱부터 적용돼요'); }
  else if(t.id==='rate'){ S.set.rate=+t.value; save(); }
});
document.addEventListener('input',e=>{
  if(e.target.id!=='wq') return;
  wordQuery=e.target.value; clearTimeout(window._wq);
  window._wq=setTimeout(()=>{ render(); const i=$('#wq'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } },250);
});

render();
initStore();
</script>

</body></html>
