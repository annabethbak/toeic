/* Layout: OMR answer-sheet motif. Sticky tab bar, one column of "sheets"; bubbles for answers, 10-dot repetition track per word. */

<script>
/* ================= DATA ================= */
// RC 필수 어휘(800점 목표)는 data-words.js의 WORD_DATA에서 읽는다. word|품사|뜻|예문
const RAW_WORDS = WORD_DATA.trim().split('\n').map((l,i)=>{const [w,p,m,e]=l.split('|');return {id:i,w,p,m,e};});
const C = window.Core;

// RC 문항(25일 × 20문항)은 rc.json에서 불러온다.
let RC=null;
fetch('rc.json?v=b24bc804').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{ RC=d; if(ready) keepScroll(render); else render(); }).catch(()=>{ RC=false; render(); });

// LC 문항(Part 2 150 · Part 3 50세트 · Part 4 25세트)은 data-lc.js의 P2·P3·P4.
// 정답은 원본 보기 0번이 기본이고, 문항에 a(정답 인덱스)가 있으면 그 값을 쓴다. 화면에서는 보기를 섞어 보여준다.
// 문항 버전·수정 이력은 data-meta.js의 QMETA. 채점·이관 규칙은 study-core.js.

const TIPS = {
 p2:"<b>Part 2</b> 첫 단어(의문사)만은 반드시 잡으세요. 800점대는 '확인해 볼게요 / 아직 몰라요 / 이미 했어요' 같은 우회 응답과, 질문 단어를 그대로 반복하거나 발음이 비슷한 보기를 걸러내는 게 관건입니다.",
 p3:"<b>Part 3</b> 대화가 나오기 전에 문제 3개를 먼저 읽어 두세요. 정답은 대개 대화 순서대로 나오고, 본문 표현이 바뀌어 나옵니다(cracked → damaged).",
 p4:"<b>Part 4</b> 첫 문장에서 담화 종류(공지·전화 메시지·뉴스·투어)를 정하세요. 숫자와 'but' 뒤 정보는 함정으로 자주 나옵니다."
};
const CONTACT='worketoileforet@gmail.com';

/* ================= UTIL ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dkey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => dkey(new Date());
const addDays = (k,n) => { const [y,m,d]=k.split('-').map(Number); const t=new Date(y,m-1,d+n); return dkey(t); };
function seeded(seed){ let s = (seed*2654435761)>>>0 || 1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function perm(n, seed){ const r=seeded(seed+7), a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const hash = s => { let h=0; for(const ch of String(s)) h=(h*31+ch.charCodeAt(0))>>>0; return h; };
const L = i => 'ABCD'[i];
const mmss = ms => { const s=Math.max(0,Math.round(ms/1000)); return pad(Math.floor(s/60))+':'+pad(s%60); };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
const mctx = () => ({QMETA, today:today()});

/* ================= STATE / STORAGE ================= */
// claude.ai 안에서 열릴 때(iframe)만 계정 저장·음성 기능을 최대 5초 기다린다. 일반 웹사이트에서는 기다리지 않고 바로 연다.
const CLAUDE_WAIT = (()=>{ try{ return window.self!==window.top ? 20 : 0; }catch(e){ return 20; } })();
const LS_KEY='toeic800-state-v1';
const blank = C.blank;
// 읽지 못한 기록은 지우지 않고 별도 키에 보관한 뒤 빈 기록으로 시작한다.
function loadLocal(key){
  let raw=null;
  try{ raw=localStorage.getItem(key); }catch(e){ return blank(); }
  if(!raw) return blank();
  try{
    const o=JSON.parse(raw);
    if(o && o.v===1 && C.isObj(o.words) && C.isObj(o.days)) return C.migrate(Object.assign(blank(),o), mctx());
  }catch(e){}
  try{ localStorage.setItem(key+':unreadable-'+Date.now(), raw); }catch(e){}
  return blank();
}
let S = loadLocal(LS_KEY);
let store = {kind:'local', ref:null}, ready=false;
// 로그인 계정이 확인되면 계정별 키(toeic800-state-v1:<uid>)를 쓴다. 비로그인은 기존 키 그대로.
let lsKey = LS_KEY;
let saveTimer=null, writing=Promise.resolve();
// u는 사용자가 직접 한 동작에서만 올린다. 오늘 덱 자동 생성 같은 저장(auto)은 올리지 않는다.
function save(auto){
  _lcm=null;
  if(!auto) S.u = Date.now();
  try{ localStorage.setItem(lsKey, JSON.stringify(S)); }catch(e){}
  if(store.kind!=='db') return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ writing = writing.then(syncWrite).catch(()=>setSync('저장 실패 · 이 브라우저에만 보관')); },700);
}
// 쓰기 직전에 계정 기록을 다시 읽어 합친 뒤 쓴다(다른 기기에서 한 학습을 덮어쓰지 않도록).
async function syncWrite(){
  const before=JSON.stringify(S);
  try{ const snap=await store.ref.get(); if(snap.exists){ const r=snap.data(); if(r&&r.v===1) S=C.migrate(C.mergeState(S,r),mctx()); } }catch(e){}
  const changed=JSON.stringify(S)!==before;
  try{ localStorage.setItem(lsKey, JSON.stringify(S)); }catch(e){}
  await store.ref.set(JSON.parse(JSON.stringify(S)));
  setSync('계정에 저장됨');
  if(changed && !dragging) keepScroll(render);
}
function setSync(t){ $('#sync').textContent=t; }
const activity=C.activity;
async function initStore(){
  try{
    for(let i=0;i<CLAUDE_WAIT && !(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,250));
    if(!(window.claude&&window.claude.use)) return;
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db||!user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc('data/users/'+uid+'/state');
    // 다른 계정이나 비로그인 상태에서 이 브라우저에 남은 기록은 섞지 않는다
    lsKey = LS_KEY+':'+uid; S = loadLocal(lsKey);
    const snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
    store = {kind:'db', ref};
    if(snap.exists){ const remote=snap.data(); if(remote && remote.v===1) S=C.migrate(C.mergeState(S,remote,true),mctx()); }
    try{ localStorage.setItem(lsKey,JSON.stringify(S)); }catch(e){}
    setSync('계정에 저장됨');
  }catch(e){ setSync('이 브라우저에 저장 중'); }
  finally{
    // 계정 기록을 확인한 뒤에야 오늘 덱을 만들고 화면을 연다(예전 기록으로 학습이 시작되지 않도록)
    ready=true; ensureToday(); keepScroll(render);
    if(store.kind==='db') save(true);
  }
}

/* ================= DAY SETUP ================= */
function studyIndex(k){ return Object.keys(S.days).sort().indexOf(k); }
function ensureToday(){
  const t=today();
  if(S.days[t]) return S.days[t];
  // drop finished decks from older days to keep the record small
  for(const k in S.days){ if(S.days[k].pos>=S.days[k].deck.length) S.days[k].deck=[]; }
  const due = Object.entries(S.words).filter(([,w])=>w && !w.m && w.d<=t).map(([id])=>+id);
  const fresh=[];
  while(fresh.length<S.set.newPerDay && S.next<WORDS().length){ if(!S.words[S.next]) fresh.push(S.next); S.next++; }
  fresh.forEach(id=>{ S.words[id]={r:0,h:'',d:t,m:false,f:t,s:0}; });
  S.days[t]={deck:shuffle([...due,...fresh]), pos:0, k:0, x:0, nw:fresh.length, rv:due.length, lc:{}};
  save(true);
  return S.days[t];
}
function WORDS(){ return RAW_WORDS; }
const studiedDays = () => Object.values(S.days).filter(d=>activity(d)>0).length;
const deckDone = d => !d.deck || d.pos>=d.deck.length;
const routineDone = d => deckDone(d) && Object.keys(d.lc||{}).length>=15 && (d.rcn||0)>=20;
const anyStudy = () => Object.values(S.days).some(d=>activity(d)>0) || Object.keys(S.rc||{}).some(k=>Object.keys((S.rc[k]&&S.rc[k].a)||{}).length);

/* ================= TTS ================= */
let tts=null, playingId=null;
(async()=>{ for(let i=0;i<CLAUDE_WAIT && !(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,250)); try{ if(window.claude&&claude.use){ tts=await claude.use('tts'); if(tts) tts.onState(({state})=>{ if(state==='idle'){ playingId=null; paintPlay(); } }); } }catch(e){} })();
const VOICE={W:'airy',M:'rounded',M2:'buttery',N:'glassy'};
// 브라우저 음성: 목록이 늦게 오는 경우를 기다리고, 영어 음성만 쓴다. 배열 순서로 성별·억양을 정하지 않는다.
let enVoices=[];
function loadVoices(){ try{ enVoices=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang)).sort((a,b)=>(/^en[-_]US/i.test(b.lang)?1:0)-(/^en[-_]US/i.test(a.lang)?1:0)); }catch(e){ enVoices=[]; } }
if('speechSynthesis' in window){ loadVoices(); try{ speechSynthesis.addEventListener('voiceschanged',()=>{ loadVoices(); if(ready&&view==='set') keepScroll(render); }); }catch(e){} }
function waitVoices(){ return enVoices.length||!('speechSynthesis' in window) ? Promise.resolve() : new Promise(r=>{ let n=0; const t=setInterval(()=>{ loadVoices(); if(enVoices.length||++n>10){ clearInterval(t); r(); } },100); }); }
function stopAudio(){ try{ tts&&tts.stop(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} playingId=null; paintPlay(); }
async function speak(lines, id){
  if(playingId===id){ stopAudio(); return; }
  stopAudio(); playingId=id; paintPlay();
  const rate=S.set.rate;
  if(tts){
    try{ await tts.speak(lines.map(([s,t])=>({text:t, voice:VOICE[s]||'glassy', language:'en-US', rate}))); }
    catch(e){ if(e && (e.code==='not_granted'||e.code==='unavailable')){ tts=null; playingId=null; return speak(lines,id); } }
    if(playingId===id){ playingId=null; paintPlay(); }
    return;
  }
  if(!('speechSynthesis' in window)){ toast('이 브라우저에서는 음성을 재생할 수 없어요. 스크립트를 보며 연습하세요.'); playingId=null; paintPlay(); return; }
  await waitVoices(); if(playingId!==id) return;
  // 같은 재생 안에서 같은 화자는 같은 음성. 음성이 하나뿐이면 높낮이만 조금 다르게 한다(화자 구분을 보장하지 않음).
  const order=[]; lines.forEach(([s])=>{ if(!order.includes(s)) order.push(s); });
  lines.forEach(([s,t],i)=>{ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=rate*0.95; const k=order.indexOf(s);
    if(enVoices.length){ u.voice=enVoices[k%enVoices.length]; }
    u.pitch = enVoices.length>1 && k<enVoices.length ? 1 : [1,0.88,1.12,0.95][k%4];
    if(i===lines.length-1){ u.onend=()=>{ if(playingId===id){playingId=null;paintPlay();} }; u.onerror=u.onend; }
    speechSynthesis.speak(u); });
}
function paintPlay(){ document.querySelectorAll('[data-play]').forEach(b=>{ const on=b.dataset.play===playingId; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); const sp=b.querySelector('span'); if(sp) sp.textContent= on?'정지':(b.dataset.label||'듣기'); }); }

/* ================= 문항 공통: 정답·채점·위치 ================= */
const LC_DAYS=25;
function lcItems(i){
  // Day 1~25: 하루 Part 2 6문항·Part 3 2세트·Part 4 1세트, 25일 동안 겹치지 않음
  const items=[];
  for(let k=0;k<6;k++){ const n=i*6+k; items.push({part:2,id:'p2-'+n,n}); }
  for(let k=0;k<2;k++){ const n=i*2+k; items.push({part:3,id:'p3-'+n,n}); }
  items.push({part:4,id:'p4-'+i,n:i});
  return items;
}
function qList(items){ const out=[]; items.forEach(it=>{ if(it.part===2) out.push(it.id); else (it.part===3?P3:P4)[it.n].qs.forEach((_,j)=>out.push(it.id+'-'+j)); }); return out; }
function qInfo(qid){
  const [p,n,j]=qid.split('-'); const part=+p.slice(1), ni=+n;
  if(part===2){ const [q,ch,ex,xd]=P2[ni]; return {part,q,ch,ex,xd,order:perm(3,ni*31+2),lines:[[ni%2?'W':'M',q]],qtext:null}; }
  const set=(part===3?P3:P4)[ni], [q,ch,ex,xd]=set.qs[+j];
  return {part,q,ch,ex,xd,order:perm(4,ni*97+(+j)*13+part),lines:set.lines,set};
}
function rcQs(d){ const out=[]; let no=0; RC[d-1].forEach((it,i)=>{ if(it.t===5) out.push({qid:`r${d}-${i}-0`,no:++no}); else it.qs.forEach((q,j)=>out.push({qid:`r${d}-${i}-${j}`,no:++no})); }); return out; }
function rcQ(qid){ const [d,i,j]=qid.slice(1).split('-').map(Number); const it=RC[d-1][i]; return {d,i,j,it,q:it.t===5?it:it.qs[j],order:perm(4,d*1009+i*37+j*7)}; }
// 정답 인덱스(원본 보기 기준): 수정 메타 → 문항 a → 0
function ansIdx(qid){
  const m=C.meta(QMETA,qid); if(m && typeof m.a==='number') return m.a;
  if(qid[0]==='r' && RC){ const q=rcQ(qid).q; if(typeof q.a==='number') return q.a; }
  return 0;
}
// 기록 {c,v} → 'none' | 'ok' | 'ng' | 'stale'(수정 전 문항에 대한 답: 통계 제외·다시 풀기)
function judge(qid,rec){
  if(!rec) return 'none';
  if(C.isStale(QMETA,qid,rec.v)) return 'stale';
  return C.grade(QMETA,qid,rec.c,rec.v,ansIdx(qid)) ? 'ok' : 'ng';
}
const vOf = qid => C.curV(QMETA,qid);
function posInfo(qid){
  if(qid[0]==='r'){ const d=+qid.slice(1).split('-')[0]; let no=null, part=null;
    if(RC){ const x=rcQs(d).find(o=>o.qid===qid); no=x&&x.no; const t=rcQ(qid).it.t; part=t===8?'7 다중':String(t); }
    return {sec:'RC',day:d,no,part,label:`RC Day ${d}${no?' · '+no+'번':''}${part?' (Part '+part+')':''}`}; }
  const [p,n,j]=qid.split('-'), ni=+n, part=+p.slice(1);
  const day = part===2?Math.floor(ni/6)+1 : part===3?Math.floor(ni/2)+1 : ni+1;
  const no = part===2? ni%6+1 : part===3? 7+(ni%2)*3+(+j) : 13+(+j);
  return {sec:'LC',day,no,part:String(part),label:`LC Day ${day} · ${no}번 (Part ${part})`};
}

/* ---------- 오늘의 과정 Day (이어풀기 우선) ---------- */
let _lcm=null;
function lcMap(){ return _lcm||(_lcm=C.lcAnswerMap(S.days)); }
function lcPlan(){
  const t=today(), day=S.days[t];
  if(day && typeof day.ld==='number') return {i:day.ld, rep:!!day.lrep};
  const m=lcMap(); let i=-1, rep=false;
  for(let k=0;k<LC_DAYS;k++){ if(qList(lcItems(k)).some(q=>!(q in m))){ i=k; break; } }
  if(day && Object.keys(day.lc||{}).length){ i=Math.max(0,studyIndex(t))%LC_DAYS; }   // 오늘 이미 풀던 세트는 그대로 이어 간다
  if(i<0){ rep=true; i=Math.max(0,studyIndex(t))%LC_DAYS; }                          // 25일 과정을 다 푼 뒤: 학습일 순서로 다시 풀기
  if(day){ day.ld=i; if(rep) day.lrep=true; save(true); }
  return {i,rep};
}
// LC 문항의 현재 기록. 과정 중에는 날짜와 관계없이 그 문항의 첫 풀이, 반복 회차에는 오늘 기록만 본다.
function lcRec(qid,plan){
  if(plan && plan.rep){ const d=S.days[today()]; return d&&d.lc&&qid in d.lc ? {c:d.lc[qid], v:(d.lcv&&d.lcv[qid])||1} : null; }
  const a=lcMap()[qid]; return a?{c:a.c,v:a.v,k:a.k}:null;
}
function rcAnsweredCount(d){ const r=(S.rc||{})[d]; return r&&r.a?Object.keys(r.a).length:0; }
function rcPlan(){
  const t=today(), day=S.days[t];
  if(day && typeof day.rd==='number') return day.rd;
  let d=0;
  if(day && day.rcn>0) d=Math.min(25,Math.max(1,studyIndex(t)+1));
  else for(let k=1;k<=25;k++){ if(rcAnsweredCount(k)<20){ d=k; break; } }
  if(!d) d=Math.min(25,Math.max(1,studyIndex(t)+1));
  if(day){ day.rd=d; save(true); }
  return d;
}
function rcRec(d){ S.rc=S.rc||{}; return S.rc[d]||(S.rc[d]={a:{}}); }
function rcAns(qid){ const d=+qid.slice(1).split('-')[0], r=(S.rc||{})[d]; if(!r||!r.a||!(qid in r.a)) return null; return {c:r.a[qid], v:(r.av&&r.av[qid])||1}; }

/* ---------- 통계: 정답률은 문항별 첫 풀이만, 수정 전 문항의 답은 제외 ---------- */
function tally(list){ const o={n:0,c:0,s:0}; list.forEach(([q,r])=>{ const j=judge(q,r); if(j==='stale') o.s++; else if(j!=='none'){ o.n++; if(j==='ok') o.c++; } }); return o; }
function dayLcStats(day){ const a=day&&day.lc||{}; return tally(Object.keys(a).map(q=>[q,{c:a[q],v:(day.lcv&&day.lcv[q])||1}])); }
function lcSetStats(plan){ const qs=qList(lcItems(plan.i)); const recs=qs.map(q=>[q,lcRec(q,plan)]); const t=tally(recs); t.done=recs.filter(([,r])=>r).length; t.total=qs.length; return t; }
function lcTotals(){ const m=lcMap(); const out={n:0,c:0,part:{2:[0,0],3:[0,0],4:[0,0]}}; for(const q in m){ const j=judge(q,m[q]); if(j==='stale'||j==='none') continue; const p=+q[1]; out.n++; out.part[p][0]++; if(j==='ok'){ out.c++; out.part[p][1]++; } } return out; }
function rcStats(d){ const r=(S.rc||{})[d]; const t=tally(r&&r.a?Object.keys(r.a).map(q=>[q,{c:r.a[q],v:(r.av&&r.av[q])||1}]):[]); t.done=rcAnsweredCount(d); return t; }
function rcTotals(){ const out={n:0,c:0,part:{}}; for(const d in (S.rc||{})){ const a=S.rc[d].a||{}; for(const q in a){ const j=judge(q,rcAns(q)); if(j==='stale'||j==='none') continue; out.n++; const ok=j==='ok'; if(ok) out.c++;
    if(RC){ const t=rcQ(q).it.t, p=t===8?7:t; const pp=out.part[p]||(out.part[p]=[0,0]); pp[0]++; if(ok) pp[1]++; } } } return out; }
// 질문·보기가 바뀐 뒤 아직 새로 풀지 않은 문항
function staleList(){
  const out=[];
  for(const d in (S.rc||{})){ const a=S.rc[d].a||{}; for(const q in a) if(judge(q,rcAns(q))==='stale') out.push(q); }
  const m=lcMap(); for(const q in m) if(judge(q,m[q])==='stale') out.push(q);
  return out;
}

function accChart(keys){
  const W=320,H=150,P=24, n=Math.max(keys.length,1), bw=(W-P-8)/Math.max(n,7);
  const y=v=>H-18-(v/100)*(H-36);
  let bars='';
  keys.forEach((k,i)=>{ const s=dayLcStats(S.days[k]); if(!s.n) { bars+=`<text x="${P+i*bw+bw/2}" y="${H-22}" text-anchor="middle">·</text>`; } else { const v=s.c/s.n*100; bars+=`<rect x="${P+i*bw+bw*0.18}" y="${y(v)}" width="${bw*0.64}" height="${H-18-y(v)}" rx="3" fill="var(--omr)"><title>${k}: ${Math.round(v)}%</title></rect>`; }
    if(i===0||i===keys.length-1) bars+=`<text x="${P+i*bw+bw/2}" y="${H-4}" text-anchor="middle">${k.slice(5).replace('-','/')}</text>`; });
  const grid=[0,50,100].map(v=>`<line x1="${P}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join('');
  const goal=`<line x1="${P}" x2="${W-4}" y1="${y(80)}" y2="${y(80)}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="LC 정답률 막대그래프">${grid}${goal}${bars}</svg>`;
}
function stageChart(){
  const W=320,H=150,P=24, labs=['0','1','2','3','장기','제외'], b=Array(6).fill(0);
  for(const id in S.words){ const w=S.words[id]; if(!w) continue; if(w.m) b[5]++; else b[Math.min(w.s||0,4)]++; }
  const max=Math.max(1,...b), bw=(W-P-8)/6, y=v=>(v/max)*(H-36);
  let s='';
  b.forEach((v,i)=>{ const x=P+i*bw+bw*0.15, w=bw*0.7, h=y(v);
    if(v) s+=`<rect x="${x}" y="${H-18-h}" width="${w}" height="${h}" rx="2" fill="${i===4?'var(--know)':i===5?'var(--muted)':'var(--omr)'}"><title>${labs[i]}: ${v}개</title></rect>`;
    s+=`<text x="${x+w/2}" y="${H-4}" text-anchor="middle">${labs[i]}</text>`; });
  s+=`<text x="${P-4}" y="${H-18-y(max)+3}" text-anchor="end">${max}</text><line x1="${P}" x2="${W-4}" y1="${H-18}" y2="${H-18}" stroke="var(--line)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="복습 단계별 단어 수">${s}</svg>`;
}

function bindDeck(){

  $('#bK').onclick=()=>decide(true); $('#bD').onclick=()=>decide(false);

  say.onclick=e=>{ e.stopPropagation(); speak([['N',e.currentTarget.dataset.say]],'w'+card.dataset.id); };
  const sk=card.querySelector('.stamp.k'), sd=card.querySelector('.stamp.d');
  let x0=null,y0=0,dx=0,dy=0,t0=0;
  const start=(x,y)=>{ dragging=true; x0=x; y0=y; dx=0; dy=0; t0=performance.now(); card.style.transition='none'; };
  const move=(x,y)=>{ if(x0===null) return; dx=x-x0; dy=y-y0;
    card.style.transform=`translate(${dx}px,${dy*0.2}px) rotate(${dx/16}deg)`;
    sk.style.opacity=Math.max(0,Math.min(1,-dx/80)); sd.style.opacity=Math.max(0,Math.min(1,dx/80)); };
  // 앱이 제스처를 가로채 '취소'가 와도, 이미 충분히 밀었거나 빠르게 튕겼으면 넘긴다.
  const finish=()=>{ if(x0===null) return; dragging=false; const dt=Math.max(1,performance.now()-t0); x0=null; card.style.transition='';
    const th=Math.min(100,card.offsetWidth*0.22), fast=Math.abs(dx)>40 && Math.abs(dx)/dt>0.3;
    if(Math.abs(dx)>th || fast){ decide(dx<0); return; }
    card.style.transform=''; sk.style.opacity=0; sd.style.opacity=0;
    if(Math.abs(dx)<6 && Math.abs(dy)<6){ flipped=!flipped; render(); } };
  // 터치: 전용 이벤트로 받고 카드 위의 기본 제스처(스크롤·앱 뒤로가기 스와이프)를 막는다.
  card.addEventListener('touchstart',e=>{ lastTouch=Date.now(); if(e.touches.length!==1) return; e.preventDefault(); const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:false});
  card.addEventListener('touchmove',e=>{ lastTouch=Date.now(); if(x0===null) return; e.preventDefault(); const t=e.touches[0]; move(t.clientX,t.clientY); },{passive:false});
  card.addEventListener('touchend',e=>{ lastTouch=Date.now(); if(x0===null) return; e.preventDefault(); finish(); },{passive:false});
  card.addEventListener('touchcancel',()=>{ lastTouch=Date.now(); finish(); });
  // 마우스·펜 (터치 직후 브라우저가 흉내 내는 마우스 이벤트는 무시)
  const notMouse=e=>e.pointerType==='touch'||Date.now()-lastTouch<800;
  card.addEventListener('pointerdown',e=>{ if(notMouse(e)) return; start(e.clientX,e.clientY); try{ card.setPointerCapture(e.pointerId); }catch(_){} });
  card.addEventListener('pointermove',e=>{ if(notMouse(e)) return; move(e.clientX,e.clientY); });
  card.addEventListener('pointerup',e=>{ if(notMouse(e)) return; finish(); });
  card.addEventListener('pointercancel',e=>{ if(notMouse(e)) return; finish(); });
}
let deciding=false, lastTouch=0, dragging=false;
function decide(known){
  const day=S.days[today()]; const card=$('#card'); if(!card||deciding) return;
  deciding=true;
  const id=+card.dataset.id, t=today();
  const w=S.words[id]||(S.words[id]={r:0,h:'',d:t,m:false,f:t,s:0});
  const before=w.s||0;
  C.wordDecide(w, known, t, addDays); w.t=Date.now();
  known?day.k++:day.x++;
  day.pos++; flipped=false; save();
  card.querySelector(known?'.stamp.k':'.stamp.d').style.opacity=1;
  card.style.transform=`translate(${known?-600:600}px,40px) rotate(${known?-30:30}deg)`; card.style.opacity='0';
  if(known && w.s===C.LONG && before<C.LONG) toast(`"${WORDS()[id].w}" 장기 복습 단계예요. 14일 간격으로 계속 확인해요.`);
  setTimeout(()=>{ deciding=false; render(); },260);
}
document.addEventListener('keydown',e=>{
  if(view!=='vocab'||e.target.matches('input,select,textarea')) return;
  if(e.key===' ' && e.target.matches('button,summary')) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); decide(true); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); decide(false); }
  else if(e.key===' '){ e.preventDefault(); flipped=!flipped; render(); }
});

function commitRC(qid,c,unsure){
  const prev=rcAns(qid);
  if(prev && judge(qid,prev)!=='stale') return false;
  const d=+qid.slice(1).split('-')[0], rec=rcRec(d);
  if(prev){ rec.old=rec.old||{}; (rec.old[qid]=rec.old[qid]||[]).push({c:prev.c,v:prev.v}); }
  if(!rec.t0) rec.t0=Date.now();
  rec.a[qid]=c; const v=vOf(qid); if(v>1){ rec.av=rec.av||{}; rec.av[qid]=v; } else if(rec.av) delete rec.av[qid];
  if(Object.keys(rec.a).length>=20 && !rec.t1) rec.t1=Date.now();
  const td=S.days[today()]; if(td) td.rcn=(td.rcn||0)+1;
  afterCommit(qid,c,v,unsure);
  return true;
}

function rvCheck(qid){
  const c=rvPick[qid]; if(c===undefined) return;

  save(); keepScroll(render);
}

let bkCode='', pendingImport=null, bkOverConfirm=false;
function encodeBackup(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj)); let bin='';
  for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return 'T8B1:'+btoa(bin);
}
// 백업 코드(T8B1:…) 또는 JSON 텍스트를 읽는다. 검증을 통과하지 못하면 null(지금 기록은 그대로).
function decodeBackup(text){ return C.decodeBackup(text, mctx()); }
function backupSummary(st){
  const words=Object.values(st.words).filter(w=>w&&(w.m||(w.s||0)>=C.LONG)).length;
  const lc=Object.values(st.days).reduce((a,d)=>a+Object.keys(d.lc||{}).length,0);
  const rc=Object.values(st.rc||{}).reduce((a,d)=>a+Object.keys((d&&d.a)||{}).length,0);
  const last=Object.keys(st.days).filter(k=>activity(st.days[k])>0).sort().pop();
  return {words,lc,rc,last:last?last.replace(/-/g,'.'):'없음'};
}

function copyBackupCode(){
  const code=encodeBackup(S);
  const ok=()=>{ markBackup(); bkCode=''; keepScroll(render); toast('백업 코드를 복사했어요. 메모 앱 등에 붙여넣어 보관하세요'); };
  const fail=()=>{ bkCode=code; markBackup(); keepScroll(render); selectBackupCode(); toast('자동 복사가 안 돼요. 아래 코드를 직접 복사해 주세요'); };
  try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok,fail); else fail(); }catch(e){ fail(); }
}
function selectBackupCode(){ const t=$('#bkout'); if(t){ t.focus(); t.select(); } }
function startImport(text){
  const data=decodeBackup(text);
  if(!data){ toast('백업 내용을 읽을 수 없어요. 지금 기록은 그대로예요'); return; }
  pendingImport=data; bkOverConfirm=false; keepScroll(render);
  const c=document.querySelector('.bk .confirm'); if(c) c.scrollIntoView({block:'nearest'});
}
// 새 상태를 다 만든 뒤에만 바꿔 끼운다(중간에 실패하면 지금 기록을 건드리지 않음).
function applyImport(mode){
  if(!pendingImport) return;
  let next;
  try{
    const imported=JSON.parse(JSON.stringify(pendingImport));
    if(mode==='merge'){ imported.r0=S.r0; next=C.migrate(C.mergeState(S,imported),mctx()); }
    else{ next=C.migrate(Object.assign(blank(),imported),mctx()); next.r0=Date.now(); }   // 덮어쓰기: 예전 동기화 사본보다 우선하도록 세대 갱신
    JSON.stringify(next);
  }catch(e){ toast('불러오기에 실패했어요. 지금 기록은 그대로예요'); return; }
  S=next;
  pendingImport=null; bkOverConfirm=false; bkCode='';
  const pasted=$('#bkpaste'); if(pasted) pasted.value='';
  save(); ensureToday(); keepScroll(render);
  toast('학습 기록을 불러왔어요');
}
function backupAge(){ return S.bk ? Math.floor((Date.now()-S.bk)/86400000) : null; }
function backupReminder(){
  const studied=Object.values(S.days).some(d=>activity(d)>0);
  const age=backupAge();
  if(!studied || (age!==null && age<7)) return '';
  return `<div class="tip row" style="justify-content:space-between;gap:8px 12px"><span style="min-width:0">마지막 백업: ${age===null?'없음':age+'일 전'} · 기기를 바꾸거나 브라우저 기록을 지우면 진도가 사라져요</span><button class="btn ghost" data-a="go" data-v="set" style="padding:5px 12px;font-size:13px">백업하기</button></div>`;
}
function vBackup(){
  const age=backupAge(), sum=pendingImport?backupSummary(pendingImport):null;
  const confirm = !pendingImport ? '' : bkOverConfirm
    ? `<div class="confirm danger" role="alertdialog" aria-label="덮어쓰기 확인"><b>정말 덮어쓸까요?</b><span style="font-size:13.5px">지금 이 기기와 계정의 학습 기록이 백업 내용으로 바뀌고, 백업 이후에 한 학습은 사라져요.</span>
        <div class="row"><button class="btn" style="border-color:var(--dunno);color:var(--dunno)" data-a="bkover">네, 덮어쓰기</button><button class="btn ghost" data-a="bkcancel">취소</button></div></div>`
    : `<div class="confirm" role="alertdialog" aria-label="백업 불러오기 확인"><b>이 백업을 불러올까요?</b>
        <ul style="font-size:13.5px"><li>장기 복습·복습 제외 단어 ${sum.words}개</li><li>LC 푼 문항 ${sum.lc}개</li><li>RC 푼 문항 ${sum.rc}개</li><li>마지막 학습일 ${sum.last}</li></ul>
        <span class="muted" style="font-size:13px">합치기는 지금 기록과 백업을 항목별로 합쳐 어느 쪽 진도도 잃지 않아요. 이전 버전 앱에서 만든 백업도 읽을 수 있어요.</span>
        <div class="row"><button class="btn pri" data-a="bkmerge">합치기 (권장)</button><button class="btn" data-a="bkoverask">덮어쓰기</button><button class="btn ghost" data-a="bkcancel">취소</button></div></div>`;
  return `<section class="sheet grid bk" style="gap:14px" id="backup">
    <h2>학습 기록 백업</h2>
    <p class="muted" style="margin:0;font-size:13.5px">마지막 백업: ${age===null?'없음':age===0?'오늘':age+'일 전'} · 기록은 이 브라우저에만 저장되고 자동 동기화는 없어요. 백업 파일이나 백업 코드를 보관해 두면 기기를 바꾸거나 브라우저 기록을 지워도 진도를 되살릴 수 있어요.</p>
    <div class="row"><button class="btn pri" data-a="bkfile">백업 파일 저장</button><button class="btn" data-a="bkcopy">백업 코드 복사</button></div>
    ${bkCode?`<label class="grid" style="gap:6px"><span style="font-size:13px">아래 코드를 전체 선택해 복사한 뒤 메모 앱 등에 보관하세요.</span><textarea id="bkout" readonly>${esc(bkCode)}</textarea></label>`:''}
    <h3>불러오기</h3>
    <div class="row"><label class="btn" for="bkin" tabindex="0">백업 파일 불러오기</label><input type="file" id="bkin" accept=".json,application/json" hidden></div>
    <label class="grid" style="gap:6px"><span style="font-size:13px">또는 백업 코드 붙여넣기</span><textarea id="bkpaste" placeholder="T8B1:로 시작하는 백업 코드를 붙여넣으세요"></textarea></label>
    <div class="row"><button class="btn" data-a="bkpaste">불러오기</button></div>
    ${confirm}
  </section>`;
}

/* ---------- 답안지(OMR) ---------- */
function omrBlock(rows,total,done){
  const open = omrOpen===null ? window.innerWidth>=720 : omrOpen;
  return `<details class="omrbox" ${open?'open':''}><summary class="muted">답안지 · ${done}/${total} 풀이</summary><div class="omr2" aria-label="답안지">${rows}</div>
    <p class="muted" style="margin:6px 0 0;font-size:12.5px">번호를 누르면 그 문제로 이동해요. 답안지 칸으로도 고를 수 있어요.</p></details>`;
}
function omrRow(qid,no,order,rec,act,ctx){
  const j=judge(qid,rec), graded=j==='ok'||j==='ng', ans=ansIdx(qid);
  const pick= !graded&&S.pk[qid]?S.pk[qid].c:undefined;
  const a = qid[0]==='r'?'rcpk':'lcpk';
  return `<div class="omr-row"><button class="no" data-a="jump" data-q="${qid}" aria-label="${no}번 문제로 이동">${pad(no)}</button>${order.map((orig,pos)=>{
    const cls=graded?(orig===ans?'k':orig===rec.c?'d':''):(pick===orig?'p':'');
    const lab=graded?(orig===ans?' 정답':orig===rec.c?' 내 답(오답)':''):(pick===orig?' 선택함':'');
    return `<button class="b ${cls}" ${graded?'disabled':''} data-a="${a}" data-q="${qid}" data-o="${orig}" aria-label="${no}번 ${L(pos)}${lab}">${L(pos)}</button>`; }).join('')}</div>`;
}
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo({top:y}); }
function setPick(qid,c){ S.pk[qid]=Object.assign({},S.pk[qid],{c}); save(true); keepScroll(render); }
async function copyText(text){ try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } }catch(e){} return false; }
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  const a=el.dataset.a, q=el.dataset.q;
  switch(a){
    case 'go': go(el.dataset.v); break;
    case 'rcgo': rcDay=+el.dataset.d||null; go('rc'); break;
    case 'rcday': rcDay=+el.dataset.d; rptOpen=null; stopAudio(); render(); window.scrollTo({top:0}); break;
    case 'lcskip': lcOverride=true; render(); break;
    case 'lcpk': case 'rcpk': setPick(q,+el.dataset.o); break;
    case 'ans': case 'ansrc': setPick(q,+el.dataset.o); break;
    case 'lccheck': { const p=S.pk[q]; if(p&&commitLC(q,p.c,p.u)){ save(); keepScroll(render); } break; }
    case 'rccheck': { const p=S.pk[q]; if(p&&commitRC(q,p.c,p.u)){ save(); keepScroll(render); } break; }
    case 'jump': { const t=document.getElementById('q-'+q); if(t){ t.scrollIntoView({behavior:'smooth',block:'center'}); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); const b=t.querySelector('.opt:not(:disabled)'); if(b) try{ b.focus({preventScroll:true}); }catch(_){} } break; }
    case 'topassage': { backTo=q; const p=document.getElementById(el.dataset.p); if(p){ p.scrollIntoView({behavior:'smooth',block:'start'}); try{ p.focus({preventScroll:true}); }catch(_){} } $('#backq').hidden=false; break; }
    case 'backq': { const t=document.getElementById('q-'+backTo); backTo=null; $('#backq').hidden=true; if(t){ t.scrollIntoView({behavior:'smooth',block:'center'}); const b=t.querySelector('button'); if(b) try{ b.focus({preventScroll:true}); }catch(_){} } break; }
    case 'playset': speakSet(el.dataset.id, el.dataset.pid); break;
    case 'playp2': playP2(el.dataset.id); break;
    case 'playrv': { const info=qInfo(q), ord=el.dataset.ord.split('').map(Number), other=(+q.split('-')[1])%2?'M':'W'; speak([...info.lines, ...ord.map((o,pos)=>[other, L(pos)+'. '+info.ch[o]])],'n'+q); break; }
    case 'rvpick': rvPick[q]=+el.dataset.o; keepScroll(render); break;
    case 'rvcheck': rvCheck(q); break;
    case 'rvagain': delete rvShown[q]; delete rvPick[q]; keepScroll(render); break;
    case 'notesf': notesFilter=el.dataset.f; if(view!=='notes') go('notes'); else keepScroll(render); break;
    case 'wf': wordFilter=el.dataset.f; render(); break;
    case 'tm': keepScroll(()=>toggleM(+el.dataset.id)); break;
    case 'delw': { const t=today(); if(S.wrong[q]&&String(S.wrong[q])[0]!=='x') S.wrong[q]='x'+t; if(S.un[q]&&String(S.un[q])[0]!=='x') S.un[q]='x'+t; delete rvShown[q]; save(); keepScroll(render); toast('복습 완료로 표시했어요. 기록은 그대로 남아 있어요'); break; }
    case 'rpt': rptOpen=el.dataset.k; rptQ=q; rptReason='answer'; rptMemo=''; keepScroll(render); { const b=$('#rptq'); if(b) try{ b.focus({preventScroll:true}); }catch(_){} } break;
    case 'rptclose': rptOpen=null; keepScroll(render); break;
    case 'rptcopy': case 'rptmail': { const qq=rptQ;
      const body=reportText(qq,rptChosen);
      if(a==='rptcopy'){ copyText(body).then(ok=>{ if(ok) toast('신고 내용을 복사했어요. 문의 메일에 붙여넣어 보내 주세요'); else { const pre=$('#rptprev'); if(pre){ const r=document.createRange(); r.selectNodeContents(pre); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } toast('자동 복사가 안 돼요. 선택된 내용을 직접 복사해 주세요'); } }); }
      else { location.href='mailto:'+CONTACT+'?subject='+encodeURIComponent('[English800 오류 신고] '+qq)+'&body='+encodeURIComponent(body); toast('메일 앱에서 내용을 확인하고 직접 보내 주세요. 보내기 전에는 접수되지 않아요'); }
      break; }
    case 'resetask': confirmReset=true; render(); break;
    case 'resetno': confirmReset=false; render(); break;
    case 'resetyes': S=blank(); S.r0=Date.now(); confirmReset=false; save(); go('home'); break;
    case 'bkfile': saveBackupFile(); break;
    case 'bkcopy': copyBackupCode(); break;
    case 'bkpaste': { const t=$('#bkpaste'); startImport(t?t.value:''); break; }
    case 'bkmerge': applyImport('merge'); break;
    case 'bkoverask': bkOverConfirm=true; keepScroll(render); break;
    case 'bkover': applyImport('overwrite'); break;
    case 'bkcancel': pendingImport=null; bkOverConfirm=false; keepScroll(render); break;
  }
});
function speakSet(sid,pid){ const [p,n]=sid.split('-'); const set=(p==='p3'?P3:P4)[+n]; speak([['N',set.intro], ...set.lines], pid||sid); }
document.addEventListener('toggle',e=>{ if(e.target.classList&&e.target.classList.contains('omrbox')) omrOpen=e.target.open; },true);
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='bkin'){ const f=t.files&&t.files[0]; t.value=''; if(f) f.text().then(startImport,()=>toast('백업 내용을 읽을 수 없어요. 지금 기록은 그대로예요')); return; }
  if(t.dataset.a2==='unsure'){ const q=t.dataset.q; S.pk[q]=Object.assign({},S.pk[q],{u:t.checked}); if(S.pk[q].c===undefined && !t.checked) delete S.pk[q]; save(true); return; }
  if(t.id==='rptreason'){ rptReason=t.value; const pre=$('#rptprev'); if(pre) pre.textContent=reportText(rptQ, rptChosen); return; }
  if(t.id==='rptq'){ rptQ=t.value; rptChosen=chosenOf(rptQ); const pre=$('#rptprev'); if(pre) pre.textContent=reportText(rptQ, rptChosen); return; }
  if(t.id==='p2text'){ S.set.showP2=t.checked; save(); keepScroll(render); }
  else if(t.id==='npd'){ S.set.newPerDay=+t.value; save(); toast('내일 덱부터 적용돼요'); }
  else if(t.id==='rate'){ S.set.rate=+t.value; save(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='rptmemo'){ const pre=$('#rptprev'); if(pre&&rptOpen) pre.textContent=reportText(rptQ, rptChosen); return; }
  if(e.target.id!=='wq') return;
  wordQuery=e.target.value; clearTimeout(window._wq);
  window._wq=setTimeout(()=>{ render(); const i=$('#wq'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } },250);
});

render();
initStore();
</script>
